name: Watch for new internship postings

# Deliberately dispatch-only. GitHub's `schedule:` queue throttled this repo
# to roughly one run every 2.6 hours despite a "*/15" cron, which is useless
# for catching new postings early. The 30-minute cadence now comes from the
# Cloudflare Worker in worker/, which calls the workflow_dispatch API.
# See "Scheduling" in the README.
on:
  workflow_dispatch: {}

permissions:
  contents: write   # needed so the workflow can commit the updated snapshot state

# A slow run can still be going when the next one is dispatched, and two
# jobs committing state at once is exactly the race that causes duplicate
# alerts. Queue them instead of running in parallel. Queuing alone isn't
# enough, though -- see the "Start from the latest state" step.
concurrency:
  group: job-watcher-state
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # checkout@v4 checks out the commit main pointed at when the run was
      # DISPATCHED. A run that queued behind another would start from state
      # the first run has since replaced, and re-send everything it sent.
      - name: Start from the latest state
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard FETCH_HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Check repos for new postings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional pair. The token alone pre-places the triage emoji.
          # Token + channel id also switches posting from the webhook to
          # the bot, which is what allows the Apply button. Postings
          # deliver normally with neither set.
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          # Set either to 0 to receive grad-level / new-grad postings
          # again (tagged rather than dropped). See "What gets dropped".
          EXCLUDE_GRAD_LEVEL: "1"
          EXCLUDE_NEW_GRAD: "1"
        run: python check_jobs.py

      # always(): the script exits non-zero when it needs attention (failed
      # deliveries, dead sources) but has saved its state first, and a run
      # cancelled midway has already sent -- and recorded -- some cards.
      # Skipping the commit in either case would re-send them next run.
      - name: Save updated snapshot state
        if: always()
        run: |
          git config user.name "job-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --staged --quiet && echo "No state changes to commit." && exit 0
          git commit -m "Update job snapshot state [skip ci]"
          # The branch can still move under a run -- a code push while it was
          # going. Rebase onto it; on a conflict in state/ keep THIS run's
          # files (-X theirs is the commit being replayed), since this run
          # started from the latest state and holds what it just sent.
          for i in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "State pushed on attempt $i."
              exit 0
            fi
            echo "Push failed (attempt $i), rebasing and retrying..."
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase -X theirs FETCH_HEAD; then
              git rebase --abort
              echo "::error::Rebase onto ${GITHUB_REF_NAME} failed outside state/; not retrying."
              exit 1
            fi
            sleep 5
          done
          echo "::error::Could not push state after 3 attempts. This run's ledger is NOT saved, so the next run may re-send its postings."
          exit 1
